<!DOCTYPE html>
<html lang="en">
    <meta charset="UTF-8">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='Products.css') }}">
    <title>Products</title>
</head>
<body>
{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h1>Products</h1>
<button><a href="{{ url_for('add_product') }}">Add Product</a></button>
<table>
    <tr><th>Product ID</th><th>Product Name</th><th>Actions</th></tr>
    {% for product in products %}
    <tr>
        <td>{{ product.product_id }}</td>
        <td>{{ product.name }}</td>
        <td class="actions">
            <button><a href="{{ url_for('edit_product', product_id=product.product_id) }}">Edit</a></button>
            <form method="POST" action="{{ url_for('delete_product', product_id=product.product_id) }}" style="display:inline">
                <button type="submit" class="btn btn-plain">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
</body>
</html>
