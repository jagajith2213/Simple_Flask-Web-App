 <link rel="stylesheet" href="{{ url_for('static', filename='Products.css') }}">
{% extends "base.html" %}
{% block title %}Locations{% endblock %}
{% block content %}
<h1>Locations</h1>
<button><a href="{{ url_for('add_location') }}">Add Location</a></button>
<table>
    <tr><th>Location ID</th><th>Location Name</th><th>Actions</th></tr>
    {% for location in locations %}
    <tr>
        <td>{{ location.location_id }}</td>
        <td>{{ location.name }}</td>
        <td class="actions">
            <button><a href="{{ url_for('edit_location', location_id=location.location_id) }}">Edit</a></button>
            <form method="POST" action="{{ url_for('delete_location', location_id=location.location_id) }}" style="display:inline">
                <button type="submit" class="btn btn-plain">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
